<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for gradients -->
  <defs>
    <!-- Deep Red to Burnt Orange for warm side of brand -->
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B0000" />
      <stop offset="100%" stop-color="#B35412" />
    </linearGradient>
    
    <!-- Olive Green gradient for the leaf -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8BB85C" />
      <stop offset="100%" stop-color="#4E662B" />
    </linearGradient>

    <!-- Warm Gold for the outer accent circle -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B35412" />
      <stop offset="60%" stop-color="#F4D03F" />
      <stop offset="100%" stop-color="#FAF9F6" />
    </linearGradient>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2C1E11" flood-opacity="0.12" />
    </filter>
  </defs>

  <g filter="url(#subtleShadow)">
    <!-- Outer Ring - Thick, Elegant -->
    <circle cx="256" cy="256" r="220" stroke="url(#goldGrad)" stroke-width="10" fill="none" />
    
    <!-- Thin Inner Border -->
    <circle cx="256" cy="256" r="202" stroke="#E0D4C3" stroke-width="2" fill="none" opacity="0.4" />
    
    <!-- Background central circular plate -->
    <circle cx="256" cy="256" r="175" fill="#FAF9F6" stroke="#E0D4C3" stroke-width="1" />
    
    <!-- Stylized Bowl / Plate Silhouette in deep red/burnt orange gradient -->
    <path d="M 146 256 C 146 330, 195 366, 256 366 C 317 366, 366 330, 366 256 C 366 248, 360 242, 352 242 L 160 242 C 152 242, 146 248, 146 256 Z" 
          fill="url(#warmGrad)" />
          
    <!-- Dynamic Steam / Nutrition Ribbon weaving upwards -->
    <path d="M 230 220 C 230 180, 270 180, 270 140 C 270 120, 256 100, 256 100 C 256 100, 242 120, 242 140 C 242 180, 282 180, 282 220" 
          stroke="#FAF9F6" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.25" />

    <!-- A beautiful, large organic Leaf arising from the center, tilted slightly -->
    <!-- Center point 256, Leaf starts at 256, 300 and extends to 256, 120 -->
    <!-- Leaf base sits inside the bowl, leaf tip reaches high up -->
    <g transform="rotate(-15 256 256)">
      <!-- Behind Leaf Shadow or highlight -->
      <path d="M 256 130 
               C 290 180, 310 225, 310 270 
               C 310 320, 285 350, 256 350 
               C 227 350, 202 320, 202 270 
               C 202 225, 222 180, 256 130 Z" 
            fill="url(#leafGrad)" />
            
      <!-- Center Leaf Stem/Vein (Light Beige/Cream) -->
      <path d="M 256 350 C 256 280, 256 200, 256 150" 
            stroke="#FAF9F6" stroke-width="4" stroke-linecap="round" opacity="0.9" />
            
      <!-- Accent side vein cuts for detail and premium look -->
      <path d="M 256 280 Q 285 260, 298 245" stroke="#FAF9F6" stroke-width="2" stroke-linecap="round" opacity="0.6" />
      <path d="M 256 250 Q 225 230, 214 215" stroke="#FAF9F6" stroke-width="2" stroke-linecap="round" opacity="0.6" />
      <path d="M 256 220 Q 280 200, 290 190" stroke="#FAF9F6" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    </g>

    <!-- Golden Sparkle/Science Star (representing health science) -->
    <path d="M 330 160 L 333 168 L 341 171 L 333 174 L 330 182 L 327 174 L 319 171 L 327 168 Z" 
          fill="#F4D03F" />
    <path d="M 180 180 L 182 185 L 187 187 L 182 189 L 180 194 L 178 189 L 173 187 L 178 185 Z" 
          fill="#F4D03F" />
  </g>
</svg>
